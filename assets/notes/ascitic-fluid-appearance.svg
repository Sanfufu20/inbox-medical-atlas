<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <style>
      .title{font:700 30px Arial,"Noto Sans TC",sans-serif;fill:#17324d}
      .head{font:700 21px Arial,"Noto Sans TC",sans-serif;fill:#17324d}
      .label{font:600 17px Arial,"Noto Sans TC",sans-serif;fill:#243746}
      .small{font:15px Arial,"Noto Sans TC",sans-serif;fill:#415466}
      .tiny{font:13px Arial,"Noto Sans TC",sans-serif;fill:#5b6c79}
    </style>
    <linearGradient id="straw" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6b0"/><stop offset="1" stop-color="#e7c85a"/></linearGradient>
    <linearGradient id="cloudy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee6b7"/><stop offset="1" stop-color="#b8aa69"/></linearGradient>
    <linearGradient id="milky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#ddd9cc"/></linearGradient>
    <linearGradient id="bloody" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d25b55"/><stop offset="1" stop-color="#7f181d"/></linearGradient>
  </defs>

  <rect width="1200" height="560" fill="#f7fafc"/>
  <text x="600" y="47" text-anchor="middle" class="title">腹水外觀四連對照：先看顏色，再決定加送什麼</text>

  <g transform="translate(32 76)">
    <rect width="270" height="430" rx="18" fill="#fff" stroke="#cad7e1" stroke-width="2"/>
    <text x="135" y="38" text-anchor="middle" class="head">清澈稻黃色</text>
    <rect x="74" y="69" width="122" height="222" rx="24" fill="#eaf0f4" stroke="#8697a5" stroke-width="3"/>
    <rect x="84" y="112" width="102" height="169" rx="14" fill="url(#straw)" opacity=".92"/>
    <rect x="65" y="58" width="140" height="31" rx="10" fill="#667b89"/>
    <path d="M95 130 Q135 118 176 130" fill="none" stroke="#fff8cf" stroke-width="4" opacity=".8"/>
    <text x="24" y="328" class="label">常見線索</text>
    <text x="24" y="352" class="small">單純肝硬化腹水最典型</text>
    <text x="24" y="382" class="label">基本必送</text>
    <text x="24" y="406" class="small">cell count + differential</text>
    <text x="24" y="428" class="small">albumin、total protein、culture</text>
  </g>

  <g transform="translate(321 76)">
    <rect width="270" height="430" rx="18" fill="#fff" stroke="#cad7e1" stroke-width="2"/>
    <text x="135" y="38" text-anchor="middle" class="head">混濁／膿樣</text>
    <rect x="74" y="69" width="122" height="222" rx="24" fill="#eaf0f4" stroke="#8697a5" stroke-width="3"/>
    <rect x="84" y="112" width="102" height="169" rx="14" fill="url(#cloudy)" opacity=".95"/>
    <rect x="65" y="58" width="140" height="31" rx="10" fill="#667b89"/>
    <g fill="#7f7443" opacity=".55">
      <circle cx="104" cy="144" r="4"/><circle cx="146" cy="158" r="5"/><circle cx="170" cy="184" r="3"/>
      <circle cx="119" cy="202" r="5"/><circle cx="158" cy="236" r="4"/><circle cx="99" cy="253" r="3"/>
    </g>
    <text x="24" y="328" class="label">優先懷疑</text>
    <text x="24" y="352" class="small">感染；也可見高細胞量／乳糜</text>
    <text x="24" y="382" class="label">加送／立刻做</text>
    <text x="24" y="406" class="small">PMN 計數；床邊直接接種</text>
    <text x="24" y="428" class="small">aerobic + anaerobic blood culture</text>
  </g>

  <g transform="translate(610 76)">
    <rect width="270" height="430" rx="18" fill="#fff" stroke="#cad7e1" stroke-width="2"/>
    <text x="135" y="38" text-anchor="middle" class="head">乳白（chylous）</text>
    <rect x="74" y="69" width="122" height="222" rx="24" fill="#eaf0f4" stroke="#8697a5" stroke-width="3"/>
    <rect x="84" y="112" width="102" height="169" rx="14" fill="url(#milky)"/>
    <rect x="65" y="58" width="140" height="31" rx="10" fill="#667b89"/>
    <path d="M95 142 Q135 128 176 142" fill="none" stroke="#fff" stroke-width="8" opacity=".8"/>
    <text x="24" y="328" class="label">優先懷疑</text>
    <text x="24" y="352" class="small">淋巴漏出：惡性、肝硬化、外傷等</text>
    <text x="24" y="382" class="label">加送</text>
    <text x="24" y="406" class="small">triglyceride（≥200 mg/dL 支持）</text>
    <text x="24" y="428" class="small">疑難時驗 chylomicrons</text>
  </g>

  <g transform="translate(899 76)">
    <rect width="270" height="430" rx="18" fill="#fff" stroke="#cad7e1" stroke-width="2"/>
    <text x="135" y="38" text-anchor="middle" class="head">血性</text>
    <rect x="74" y="69" width="122" height="222" rx="24" fill="#eaf0f4" stroke="#8697a5" stroke-width="3"/>
    <rect x="84" y="112" width="102" height="169" rx="14" fill="url(#bloody)" opacity=".95"/>
    <rect x="65" y="58" width="140" height="31" rx="10" fill="#667b89"/>
    <path d="M95 135 Q135 126 176 135" fill="none" stroke="#ef8e86" stroke-width="4" opacity=".8"/>
    <text x="24" y="328" class="label">優先懷疑</text>
    <text x="24" y="352" class="small">外傷性穿刺、惡性、HCC 破裂</text>
    <text x="24" y="382" class="label">加送</text>
    <text x="24" y="406" class="small">RBC／hematocrit；必要時 cytology</text>
    <text x="24" y="428" class="small">分管漸清較支持 traumatic tap</text>
  </g>

  <text x="600" y="538" text-anchor="middle" class="tiny">外觀只能提示方向，不能取代 PMN、SAAG、蛋白與培養等定量判讀。</text>
</svg>
