<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">四型休克的典型血行動力學方向</title>
  <desc id="desc">比較低血容量、心因性、阻塞性與分布型休克的心輸出量、全身血管阻力、中心靜脈壓及中心靜脈血氧飽和度。</desc>
  <rect width="1200" height="700" rx="28" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="34" font-weight="700" fill="#0f172a">四型休克：典型血行動力學方向</text>
  <text x="600" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="19" fill="#475569">先看 CO 與 SVR，再用 CVP 與 ScvO₂ 補上前負荷和組織氧抽取</text>

  <rect x="55" y="135" width="1090" height="78" rx="16" fill="#0f172a"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="210" y="184">休克類型</text>
    <text x="470" y="174">CO</text>
    <text x="470" y="198" font-size="15" font-weight="500">心輸出量</text>
    <text x="675" y="174">SVR</text>
    <text x="675" y="198" font-size="15" font-weight="500">全身血管阻力</text>
    <text x="865" y="174">CVP</text>
    <text x="865" y="198" font-size="15" font-weight="500">右心前負荷</text>
    <text x="1045" y="174">ScvO₂</text>
    <text x="1045" y="198" font-size="15" font-weight="500">氧抽取後</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif">
    <rect x="55" y="228" width="1090" height="88" rx="14" fill="#e0f2fe"/>
    <text x="92" y="265" font-size="25" font-weight="700" fill="#075985">低血容量型</text>
    <text x="92" y="293" font-size="17" fill="#475569">沒東西可裝</text>
    <text x="470" y="288" text-anchor="middle" font-size="48" font-weight="800" fill="#dc2626">↓</text>
    <text x="675" y="288" text-anchor="middle" font-size="48" font-weight="800" fill="#16a34a">↑</text>
    <text x="865" y="288" text-anchor="middle" font-size="48" font-weight="800" fill="#dc2626">↓</text>
    <text x="1045" y="288" text-anchor="middle" font-size="48" font-weight="800" fill="#dc2626">↓</text>

    <rect x="55" y="327" width="1090" height="88" rx="14" fill="#fee2e2"/>
    <text x="92" y="364" font-size="25" font-weight="700" fill="#991b1b">心因性</text>
    <text x="92" y="392" font-size="17" fill="#475569">裝進去但打不出來</text>
    <text x="470" y="387" text-anchor="middle" font-size="48" font-weight="800" fill="#dc2626">↓</text>
    <text x="675" y="387" text-anchor="middle" font-size="48" font-weight="800" fill="#16a34a">↑</text>
    <text x="865" y="387" text-anchor="middle" font-size="48" font-weight="800" fill="#16a34a">↑</text>
    <text x="1045" y="387" text-anchor="middle" font-size="48" font-weight="800" fill="#dc2626">↓</text>

    <rect x="55" y="426" width="1090" height="88" rx="14" fill="#fef3c7"/>
    <text x="92" y="463" font-size="25" font-weight="700" fill="#92400e">阻塞型</text>
    <text x="92" y="491" font-size="17" fill="#475569">血流卡在心臟前後</text>
    <text x="470" y="486" text-anchor="middle" font-size="48" font-weight="800" fill="#dc2626">↓</text>
    <text x="675" y="486" text-anchor="middle" font-size="48" font-weight="800" fill="#16a34a">↑</text>
    <text x="865" y="486" text-anchor="middle" font-size="48" font-weight="800" fill="#16a34a">↑</text>
    <text x="1045" y="486" text-anchor="middle" font-size="48" font-weight="800" fill="#dc2626">↓</text>

    <rect x="55" y="525" width="1090" height="88" rx="14" fill="#dcfce7"/>
    <text x="92" y="562" font-size="25" font-weight="700" fill="#166534">分布型</text>
    <text x="92" y="590" font-size="17" fill="#475569">血管張力掉、早期高輸出</text>
    <text x="470" y="585" text-anchor="middle" font-size="48" font-weight="800" fill="#16a34a">↑</text>
    <text x="675" y="585" text-anchor="middle" font-size="48" font-weight="800" fill="#dc2626">↓</text>
    <text x="865" y="585" text-anchor="middle" font-size="48" font-weight="800" fill="#dc2626">↓</text>
    <text x="1045" y="585" text-anchor="middle" font-size="48" font-weight="800" fill="#16a34a">↑</text>
  </g>

  <line x1="360" y1="135" x2="360" y2="613" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="570" y1="135" x2="570" y2="613" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="775" y1="135" x2="775" y2="613" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="955" y1="135" x2="955" y2="613" stroke="#cbd5e1" stroke-width="2"/>

  <text x="600" y="655" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="17" fill="#64748b">典型早期型態；敗血症晚期或合併心肌抑制時，CO 與 ScvO₂ 可能不再升高。</text>
</svg>
