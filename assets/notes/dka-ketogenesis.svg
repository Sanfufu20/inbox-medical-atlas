<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#526174}
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.arr{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1100" height="650" fill="#fff"/>
  <text x="550" y="44" text-anchor="middle" class="title">DKA ketogenesis：酮體三兄弟與尿酮試紙盲點</text>
  <text x="550" y="74" text-anchor="middle" class="s">胰島素不足＋glucagon／catecholamine 上升，把燃料從葡萄糖切到脂肪</text>

  <rect x="55" y="135" width="210" height="100" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="160" y="173" text-anchor="middle" class="h">脂肪組織</text><text x="160" y="204" text-anchor="middle" class="b">lipolysis → free fatty acid</text>
  <rect x="335" y="135" width="220" height="100" rx="18" class="box"/>
  <text x="445" y="173" text-anchor="middle" class="h">肝粒線體</text><text x="445" y="204" text-anchor="middle" class="b">β-oxidation → acetyl-CoA</text>
  <rect x="625" y="135" width="220" height="100" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="735" y="173" text-anchor="middle" class="h">Acetoacetate</text><text x="735" y="204" text-anchor="middle" class="b">第一個 ketone body</text>
  <path d="M265 185 L330 185" class="arr"/><path d="M555 185 L620 185" class="arr"/>

  <rect x="390" y="345" width="300" height="115" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="540" y="383" text-anchor="middle" class="h">β-hydroxybutyrate（BHB）</text>
  <text x="540" y="414" text-anchor="middle" class="b">可逆；由 NADH/NAD⁺ 比值控制</text>
  <text x="540" y="442" text-anchor="middle" class="s">DKA 最重時占比最高</text>
  <path d="M700 235 C670 285,620 310,570 340" class="arr"/>
  <path d="M570 335 C635 305,690 282,725 240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="535" y="300" class="s">NADH ↑：往 BHB</text>

  <rect x="785" y="345" width="255" height="115" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="912" y="383" text-anchor="middle" class="h">Acetone</text><text x="912" y="414" text-anchor="middle" class="b">不可逆脫羧</text><text x="912" y="442" text-anchor="middle" class="s">揮發 → 呼氣水果味</text>
  <path d="M770 235 C800 280,850 315,885 340" class="arr"/>

  <rect x="65" y="330" width="250" height="145" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/>
  <text x="190" y="366" text-anchor="middle" class="h" fill="#be123c">Nitroprusside 尿酮</text>
  <text x="190" y="398" text-anchor="middle" class="b">✓ acetoacetate</text><text x="190" y="426" text-anchor="middle" class="b">△ 少量 acetone</text>
  <text x="190" y="454" text-anchor="middle" class="b" fill="#be123c">✗ 完全測不到 BHB</text>
  <path d="M315 390 C470 280,610 245,690 222" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>

  <rect x="160" y="530" width="780" height="78" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="550" y="562" text-anchor="middle" class="h">發作時：BHB ≫ acetoacetate → 尿酮低估嚴重度</text>
  <text x="550" y="590" text-anchor="middle" class="b">治療後 BHB 轉回 acetoacetate → 病人改善，尿酮卻可能暫時更強</text>
</svg>
